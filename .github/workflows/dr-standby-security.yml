name: BimaGinga cold standby security tests
on:
  pull_request:
    paths:
      - 'app.py'
      - 'render.yaml'
      - 'requirements.txt'
      - 'tests/**'
      - '.github/workflows/dr-standby-security.yml'
  push:
    branches: [main]
    paths:
      - 'app.py'
      - 'render.yaml'
      - 'requirements.txt'
      - 'tests/**'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      BIMAGINGA_DATA_DIR: /tmp/bimaginga-dr-ci
      BIMA_DR_STANDBY: 'true'
      BIMAGINGA_OWNER_KEY: ci-fixture-key-not-a-real-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: pip install -r requirements.txt
      - name: Check Python syntax
        run: python -m compileall -q app.py router.py task_store.py
      - name: Run standby access and task-safety regression
        run: python -m unittest discover -s tests -p 'test_*.py' -v
